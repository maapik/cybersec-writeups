<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 165" width="900" height="165" role="img" aria-label="maapik Case Files and Writeups">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0c"/>
      <stop offset="55%" stop-color="#111216"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#272a30"/>
      <stop offset="25%" stop-color="#9ca3af"/>
      <stop offset="50%" stop-color="#e4e4e7"/>
      <stop offset="75%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#272a30"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1f2228" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
    <pattern id="scanlines" width="900" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="900" y2="0" stroke="#ffffff" stroke-width="1" stroke-opacity="0.025"/>
    </pattern>
    <clipPath id="cardClip">
      <rect width="900" height="165" rx="14"/>
    </clipPath>
  </defs>
  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .cursor { animation: blink 1.1s step-end infinite; }
    .pulse { animation: pulseDot 2.8s ease-in-out infinite; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .sans { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
  </style>
  <g clip-path="url(#cardClip)">
    <rect width="900" height="165" fill="url(#bg)"/>
    <rect width="900" height="165" fill="url(#grid)"/>
    <rect width="900" height="165" fill="url(#scanlines)"/>
    <rect x="0" y="0" width="900" height="2" fill="url(#steel)"/>
    <!-- Window bar -->
    <rect x="0" y="2" width="900" height="28" fill="#0d0e12" fill-opacity="0.85"/>
    <line x1="0" y1="30" x2="900" y2="30" stroke="#272a30" stroke-width="1"/>
    <circle cx="24" cy="16" r="4.8" fill="#3f434d"/>
    <circle cx="42" cy="16" r="4.8" fill="#525763"/>
    <circle cx="60" cy="16" r="4.8" fill="#6b7280"/>
    <text x="82" y="20" class="mono" font-size="11.5" fill="#71717a">maapik@forensics:~/cybersec-writeups — tty1</text>
    <!-- Main Left -->
    <text x="36" y="64" class="mono" font-size="12.5" fill="#71717a">$ ls -la ./case-files/</text>
    <text x="36" y="106" class="mono" font-size="34" font-weight="700" fill="#f4f4f5">Case Files &amp; Writeups<tspan class="cursor" fill="#d4d4d8">_</tspan></text>
    <text x="36" y="138" class="sans" font-size="13.5" font-weight="600" fill="#a1a1aa">DFIR  //  Incident Response  //  Reverse Engineering  //  OSINT  //  Web CTF</text>
    <!-- Right side monochrome artifact tags -->
    <g transform="translate(650, 48)">
      <rect x="0" y="0" width="102" height="26" rx="6" fill="#14161a" stroke="#2e323b" stroke-width="1"/>
      <text x="51" y="17" text-anchor="middle" class="mono" font-size="11.5" fill="#d4d4d8">EVTX / 7045</text>
      <rect x="112" y="0" width="102" height="26" rx="6" fill="#14161a" stroke="#2e323b" stroke-width="1"/>
      <text x="163" y="17" text-anchor="middle" class="mono" font-size="11.5" fill="#a1a1aa">$MFT / $J</text>
      <rect x="0" y="34" width="102" height="26" rx="6" fill="#14161a" stroke="#2e323b" stroke-width="1"/>
      <text x="51" y="51" text-anchor="middle" class="mono" font-size="11.5" fill="#a1a1aa">IDA Pro / ELF</text>
      <rect x="112" y="34" width="102" height="26" rx="6" fill="#14161a" stroke="#2e323b" stroke-width="1"/>
      <text x="163" y="51" text-anchor="middle" class="mono" font-size="11.5" fill="#d4d4d8">MITRE ATT&amp;CK</text>
      <circle cx="8" cy="84" r="4" fill="#dc2626" class="pulse"/>
      <text x="20" y="88" class="mono" font-size="11" fill="#71717a">STATUS: ACTIVE_ARCHIVE</text>
    </g>
    <rect x="0.5" y="0.5" width="899" height="164" rx="14" fill="none" stroke="#272a30" stroke-width="1"/>
  </g>
</svg>
