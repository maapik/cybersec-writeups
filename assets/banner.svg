<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 165" width="900" height="165" role="img" aria-label="maapik Case Files and Writeups">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>
    <clipPath id="cardClip">
      <rect width="900" height="165" rx="14"/>
    </clipPath>
  </defs>
  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    .cursor { animation: blink 1.1s step-end infinite; }
    .pulse { animation: pulseDot 2.8s ease-in-out infinite; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .sans { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
  </style>
  <g clip-path="url(#cardClip)">
    <rect width="900" height="165" fill="url(#bg)"/>
    <rect width="900" height="165" fill="url(#grid)"/>
    <rect x="0" y="0" width="900" height="3" fill="url(#accent)"/>
    <!-- Window bar -->
    <rect x="0" y="3" width="900" height="28" fill="#0b1120" fill-opacity="0.75"/>
    <line x1="0" y1="31" x2="900" y2="31" stroke="#1e293b" stroke-width="1"/>
    <circle cx="24" cy="17" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="17" r="5" fill="#ffbd2e"/>
    <circle cx="60" cy="17" r="5" fill="#27c93f"/>
    <text x="82" y="21" class="mono" font-size="11.5" fill="#64748b">maapik@forensics:~/cybersec-writeups — evidence-vault</text>
    <!-- Main Left -->
    <text x="36" y="64" class="mono" font-size="12.5" fill="#00f5d4">$ ls -la ./case-files/</text>
    <text x="36" y="106" class="mono" font-size="34" font-weight="700" fill="#f8fafc">Case Files &amp; Writeups<tspan class="cursor" fill="#00f5d4">_</tspan></text>
    <text x="36" y="138" class="sans" font-size="14" font-weight="600" fill="#38bdf8">DFIR  •  Incident Response  •  Reverse Engineering  •  OSINT  •  Web CTF</text>
    <!-- Right side subtle artifact tags -->
    <g transform="translate(650, 48)">
      <rect x="0" y="0" width="102" height="26" rx="6" fill="#0f1b2e" stroke="#1e3a5f" stroke-width="1"/>
      <text x="51" y="17" text-anchor="middle" class="mono" font-size="11.5" fill="#38bdf8">EVTX / 7045</text>
      <rect x="112" y="0" width="102" height="26" rx="6" fill="#0f1b2e" stroke="#1e3a5f" stroke-width="1"/>
      <text x="163" y="17" text-anchor="middle" class="mono" font-size="11.5" fill="#00f5d4">$MFT / $J</text>
      <rect x="0" y="34" width="102" height="26" rx="6" fill="#0f1b2e" stroke="#1e3a5f" stroke-width="1"/>
      <text x="51" y="51" text-anchor="middle" class="mono" font-size="11.5" fill="#818cf8">IDA Pro / ELF</text>
      <rect x="112" y="34" width="102" height="26" rx="6" fill="#0f1b2e" stroke="#1e3a5f" stroke-width="1"/>
      <text x="163" y="51" text-anchor="middle" class="mono" font-size="11.5" fill="#94a3b8">MITRE ATT&amp;CK</text>
      <circle cx="8" cy="84" r="4" fill="#10b981" class="pulse"/>
      <text x="20" y="88" class="mono" font-size="11" fill="#64748b">STATUS: ACTIVE_ARCHIVE</text>
    </g>
    <rect x="0.5" y="0.5" width="899" height="164" rx="14" fill="none" stroke="#1e293b" stroke-width="1"/>
  </g>
</svg>
